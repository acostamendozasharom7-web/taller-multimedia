<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Multimedia</title>
</head>
<body>

    <!-- 1. Título principal -->
    <h1>Bienvenido a mi página multimedia</h1>

    <!-- 2. Imagen con atributo alt -->
    <img src="https://www.w3schools.com/html/pic_trulli.jpg" alt="Casa tradicional italiana">

    <!-- 3. Reproductor de video -->
    <video width="320" height="240" controls>
        <source src="movie.mp4" type="video/mp4">
        Tu navegador no soporta la etiqueta video.
    </video>

    <!-- 4. Enlace externo -->
    <p>
        <a href="https://www.google.com">Visitar Google</a>
    </p>

    <!-- 5. Enlace interno hacia contacto.html -->
    <p>
        <a href="contacto.html">Ir a la página de contacto</a>
    </p>

</body>
</html>
